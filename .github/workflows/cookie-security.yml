name: Cookie export security boundary
on:
  pull_request:
    paths:
      - 'cookie_export.py'
      - 'chrome_cookies.py'
      - 'import_chrome_cookies.py'
      - 'tests/test_cookie_export.py'
      - '.github/workflows/cookie-security.yml'
  push:
    branches: [main]
    paths:
      - 'cookie_export.py'
      - 'chrome_cookies.py'
      - 'import_chrome_cookies.py'
      - 'tests/test_cookie_export.py'
      - '.github/workflows/cookie-security.yml'
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m py_compile cookie_export.py chrome_cookies.py import_chrome_cookies.py
      - run: python -m pytest -q tests/test_cookie_export.py
